/* ===== BULK PARSER ===== */
function parseBulk(text){
var entries=[],date=td(),lo=text.toLowerCase();
if(/yesterday|\\u0ba8\\u0bc7\\u0bb1\\u0bb1\\u0bc1/.test(lo))date=new Date(Date.now()-86400000).toISOString().split('T')[0];
if(/today|\\u0b87\\u0ba9\\u0bc1\\u0bc1/.test(lo))date=td();
var parts=text.split(/[,;\n]+|\band\\b|\\u0bae\\u0bb1\\u0bcd\\u0bb1\\u0bc1\\u0bae\\u0bcd|\\u0bae\\u0ba4\\u0bc1\\u0bae\\u0bcd|also|\\u0bae\\u0ba4\\u0bc1/i);
for(var i=0;i<parts.length;i++){
var p=parts[i].trim();if(!p||p.length<2)continue;
var amt=0,cat='others',ds=p,am=p.match(/[\u20b9rs]\.?\s*([\d,]+\.?\d*)/i);
if(am){amt=parseFloat(am[1].replace(/,/g,''));ds=p.replace(am[0],'').replace(/^[\s,]+|[\s,]+$/g,'').trim()}
for(var cid in KW){if(new RegExp(KW[cid],'i').test(p)){cat=cid;break}}
ds=ds.replace(new RegExp('('+Object.values(KW).join('|')+')','gi'),'').replace(/^[\s\-\:]+|[\s\-\:]+$/g,'').trim();
if(amt>0)entries.push({amount:amt,category:cat,desc:ds,date:date,descTa:''});
}return entries;
}
