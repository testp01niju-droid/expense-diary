.lb{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:2px solid var(--b);background:#fff;cursor:pointer;font-family:inherit}

.by{flex:1;max-width:500px;width:100%;margin:0 auto;padding:16px;padding-bottom:80px;overflow-y:auto}
.tb{display:none}.tb.on{display:block;animation:fu .25s ease}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.cd{background:var(--w);border-radius:16px;border:1px solid var(--b);padding:16px;box-shadow:0 2px 8px rgba(45,31,20,.04)}
.cg{background:linear-gradient(135deg,#C4553A,#D4A843);border:none;color:#fff}
.bn{position:fixed;bottom:0;left:0;right:0;background:var(--w);border-top:1px solid var(--b);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}

.mh{width:40px;height:4px;background:#D5C9BB;border-radius:2px;margin:0 auto 20px}
.mc{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--bg2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}

.to{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center;animation:fu .3s ease;transition:all .3s}

.pb{height:6px;background:var(--b);border-radius:3px;overflow:hidden;width:100%}
.pf{height:100%;background:linear-gradient(90deg,var(--p),var(--a));border-radius:3px;transition:width .3s}
.oc{cursor:pointer;transition:transform .15s}.oc:active{transform:scale(.98)}
.sb2{display:flex;align-items:center;background:#fff;border-radius:12px;border:1px solid var(--b);padding:0 12px;margin-bottom:16px}

.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.sbx{background:var(--bg);border-radius:12px;padding:14px}

.rb{display:flex;align-items:center;justify-content:space-between}
.rc{display:flex;align-items:center;gap:12px}
.ib{width:32px;height:32px;border-radius:50%;border:1px solid var(--b);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}

#ed{display:none;position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:8px 12px;font-size:12px;z-index:9999;font-family:monospace;word-break:break-all;max-height:40vh;overflow-y:auto}
#ed.sh{display:block}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#D5C9BB;border-radius:2px}

</head>
