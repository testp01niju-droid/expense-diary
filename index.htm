<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#C4553A">
<link rel="manifest" href="manifest.json">
<title>Expense Diary</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#FAF6F1;color:#2D2A26;min-height:100vh}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}
.splash{align-items:center;justify-content:center;background:linear-gradient(135deg,#C4553A,#E8734A)}
.splash h1{color:#FAF6F1;font-size:28px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.setup{padding:24px;align-items:center}
.setup h2{margin-bottom:16px;font-size:22px}
.setup p{margin-bottom:24px;color:#666;text-align:center}
.input-group{width:100%;max-width:320px;margin-bottom:16px}
.input-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
.input-group input{width:100%;padding:12px;border:2px solid #E5DDD3;border-radius:10px;font-size:16px;background:#fff}
.input-group input:focus{outline:none;border-color:#C4553A}
.btn{padding:14px 32px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:#C4553A;color:#FAF6F1;width:100%;max-width:320px}
.btn-primary:hover{background:#A84630}
.error-msg{color:#C4553A;font-size:13px;margin-top:4px;display:none}
.tabs{display:flex;background:#fff;border-bottom:2px solid #E5DDD3;position:sticky;top:0;z-index:10}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:13px;font-weight:600;color:#999;cursor:pointer;border:none;background:none;transition:color .2s}
.tab.active{color:#C4553A;border-bottom:3px solid #C4553A}
.content{flex:1;padding:16px;overflow-y:auto;padding-bottom:80px}
.stat-card{background:#fff;border-radius:14px;padding:20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat-card h3{font-size:13px;color:#999;margin-bottom:4px}
.stat-card .value{font-size:32px;font-weight:700;color:#C4553A}
.bar-row{display:flex;align-items:center;margin-bottom:10px}
.bar-label{width:80px;font-size:13px;color:#666}
.bar-track{flex:1;height:20px;background:#E5DDD3;border-radius:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:10px;transition:width .5s}
.bar-amount{width:70px;text-align:right;font-size:13px;font-weight:600}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#C4553A;color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 12px rgba(196,85,58,.4);z-index:20}
.fab:hover{background:#A84630}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{margin-bottom:20px;font-size:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid #E5DDD3;border-radius:10px;font-size:16px;background:#fff}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#C4553A}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cat-btn{padding:12px 8px;border:2px solid #E5DDD3;border-radius:10px;background:#fff;text-align:center;cursor:pointer;font-size:22px;transition:all .2s}
.cat-btn.selected{border-color:#C4553A;background:#FEF0EC}
.cat-btn span{display:block;font-size:11px;margin-top:4px;color:#666}
.expense-item{display:flex;align-items:center;padding:14px;background:#fff;border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.expense-item .emoji{font-size:28px;margin-right:12px}
.expense-item .info{flex:1}
.expense-item .info .desc{font-weight:600;font-size:15px}
.expense-item .info .meta{font-size:12px;color:#999;margin-top:2px}
.expense-item .amt{font-weight:700;font-size:18px;color:#C4553A}
.expense-item .del{margin-left:12px;background:none;border:none;color:#ccc;font-size:20px;cursor:pointer}
.expense-item .del:hover{color:#C4553A}
.search-bar{width:100%;padding:12px;border:2px solid #E5DDD3;border-radius:10px;font-size:15px;margin-bottom:16px;background:#fff}
.search-bar:focus{outline:none;border-color:#C4553A}
.settings-card{background:#fff;border-radius:14px;padding:20px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.settings-card h3{margin-bottom:12px;font-size:16px}
.settings-card p{font-size:13px;color:#666;margin-bottom:12px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #E5DDD3}
.settings-row:last-child{border:none}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2D2A26;color:#FAF6F1;padding:12px 24px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:48px 24px;color:#999}
.empty-state .big{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:15px}
#debugBanner{background:#C4553A;color:#fff;padding:8px 16px;font-size:12px;display:none;position:fixed;top:0;left:0;right:0;z-index:100;text-align:center}
</style>
</head>
<body>
<div id="debugBanner"></div>

<!-- SPLASH -->
<div id="splashScreen" class="screen splash active">
  <h1>Expense Diary</h1>
</div>

<!-- SETUP -->
<div id="setupScreen" class="screen setup">
  <h2>Create Your Profile</h2>
  <p>Set a master password to protect your data. This password is stored only on this device.</p>
  <div class="input-group">
    <label>Your Name</label>
    <input type="text" id="setupName" placeholder="Enter your name">
  </div>
  <div class="input-group">
    <label>Master Password (min 4 characters)</label>
    <input type="password" id="setupPass" placeholder="Create password">
    <div class="error-msg" id="setupErr">Password must be at least 4 characters</div>
  </div>
  <div class="input-group">
    <label>Confirm Password</label>
    <input type="password" id="setupPass2" placeholder="Confirm password">
    <div class="error-msg" id="setupErr2">Passwords do not match</div>
  </div>
  <button class="btn btn-primary" id="setupBtn">Create Account</button>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="screen setup">
  <h2>Welcome Back</h2>
  <p>Enter your master password to unlock.</p>
  <div class="input-group">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="Enter password">
    <div class="error-msg" id="loginErr">Wrong password</div>
  </div>
  <button class="btn btn-primary" id="loginBtn">Unlock</button>
  <button class="btn" id="resetBtn" style="margin-top:12px;color:#C4553A;background:none">Reset All Data</button>
</div>

<!-- MAIN APP -->
<div id="mainScreen" class="screen">
  <div class="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="history">History</button>
    <button class="tab" data-tab="settings">Settings</button>
  </div>
  <div class="content" id="contentArea"></div>
  <button class="fab" id="fabBtn">+</button>
</div>

<!-- ADD EXPENSE MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Add Expense</h2>
    <div class="form-group">
      <label>Amount (₹)</label>
      <input type="number" id="expAmount" placeholder="0" min="0" step="1">
    </div>
    <div class="form-group">
      <label>Category</label>
      <div class="cat-grid" id="catGrid"></div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="expDesc" placeholder="What did you spend on?">
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="expDate">
    </div>
    <button class="btn btn-primary" id="saveExpBtn" style="margin-bottom:12px">Save Expense</button>
    <button class="btn" id="cancelExpBtn" style="color:#999;background:none">Cancel</button>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <h2 id="confirmTitle">Confirm</h2>
    <p id="confirmMsg" style="margin-bottom:20px;color:#666"></p>
    <div style="display:flex;gap:12px">
      <button class="btn" id="confirmNo" style="flex:1;background:#E5DDD3;color:#2D2A26">Cancel</button>
      <button class="btn btn-primary" id="confirmYes" style="flex:1">Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Debug helper
function debug(msg){
  var b=document.getElementById('debugBanner');
  if(b){b.textContent='DEBUG: '+msg;b.style.display='block';}
}

// Categories
var CATS=[
  {id:'food',emoji:'🍛',label:'Food',labelTa:'உணவு'},
  {id:'transport',emoji:'🚌',label:'Transport',labelTa:'போக்குவரத்து'},
  {id:'shopping',emoji:'🛍️',label:'Shopping',labelTa:'ஷாப்பிங்'},
  {id:'bills',emoji:'💡',label:'Bills',labelTa:'பில்கள்'},
  {id:'health',emoji:'💊',label:'Health',labelTa:'சுகாதாரம்'},
  {id:'education',emoji:'📚',label:'Education',labelTa:'கல்வி'},
  {id:'entertainment',emoji:'🎬',label:'Entertainment',labelTa:'பொழுதுபோக்கு'},
  {id:'rent',emoji:'🏠',label:'Rent',labelTa:'வாடகை'},
  {id:'other',emoji:'📦',label:'Other',labelTa:'மற்றவை'}
];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var selectedCat='food';
var currentTab='dashboard';
var confirmCb=null;

// IndexedDB helpers
function openDB(){
  return new Promise(function(resolve,reject){
    var r=indexedDB.open('ExpenseDiaryDB',2);
    r.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('app'))db.createObjectStore('app',{keyPath:'key'});
      if(!db.objectStoreNames.contains('expenses'))db.createObjectStore('expenses',{keyPath:'id'});
    };
    r.onsuccess=function(e){resolve(e.target.result)};
    r.onerror=function(e){reject(e.target.error)};
  });
}
function dbGet(key,store){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(store,'readonly');
      var req=tx.objectStore(store).get(key);
      req.onsuccess=function(){resolve(req.result)};
      req.onerror=function(){reject(req.error)};
    });
  });
}
function dbPut(val,store){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(store,'readwrite');
      var req=tx.objectStore(store).put(val);
      req.onsuccess=function(){resolve(req.result)};
      req.onerror=function(){reject(req.error)};
    });
  });
}
function dbGetAll(store){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(store,'readonly');
      var req=tx.objectStore(store).getAll();
      req.onsuccess=function(){resolve(req.result||[])};
      req.onerror=function(){reject(req.error)};
    });
  });
}
function dbDel(key,store){
  return openDB().then(function(db){
    return new Promise(function(resolve,reject){
      var tx=db.transaction(store,'readwrite');
      var req=tx.objectStore(store).delete(key);
      req.onsuccess=function(){resolve()};
      req.onerror=function(){reject(req.error)};
    });
  });
}

// SHA-256
async function sha256(msg){
  var buf=new TextEncoder().encode(msg);
  var hash=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,'0')}).join('');
}

// Show screen
function showScreen(id){
  var screens=document.querySelectorAll('.screen');
  for(var i=0;i<screens.length;i++)screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

// Toast
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2500);
}

// Show confirm dialog
function showConfirm(title,msg,cb){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmModal').classList.add('active');
  confirmCb=cb;
}

// Format date
function fmtDate(d){
  var dt=new Date(d);
  return dt.getDate()+' '+MONTHS[dt.getMonth()]+' '+dt.getFullYear();
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// Get cat info
function getCat(id){
  for(var i=0;i<CATS.length;i++){if(CATS[i].id===id)return CATS[i]}
  return CATS[8];
}

// Build category grid
function buildCatGrid(){
  var g=document.getElementById('catGrid');
  g.innerHTML='';
  for(var i=0;i<CATS.length;i++){
    var c=CATS[i];
    var btn=document.createElement('div');
    btn.className='cat-btn'+(selectedCat===c.id?' selected':'');
    btn.innerHTML=c.emoji+'<span>'+c.label+'</span>';
    btn.setAttribute('data-id',c.id);
    btn.onclick=function(){
      selectedCat=this.getAttribute('data-id');
      var all=document.querySelectorAll('.cat-btn');
      for(var j=0;j<all.length;j++)all[j].classList.remove('selected');
      this.classList.add('selected');
    };
    g.appendChild(btn);
  }
}

// Render dashboard
async function renderDashboard(){
  var expenses=await dbGetAll('expenses');
  var today=todayStr();
  var thisMonth=today.substring(0,7);
  var todayTotal=0,monthTotal=0;
  var catTotals={};
  var todayExpenses=[];

  for(var i=0;i<expenses.length;i++){
    var e=expenses[i];
    if(e.date===today){todayTotal+=e.amount;todayExpenses.push(e)}
    if(e.date&&e.date.startsWith(thisMonth)){monthTotal+=e.amount}
    if(!catTotals[e.category])catTotals[e.category]=0;
    catTotals[e.category]+=e.amount;
  }

  var html='<div class="stat-card"><h3>Today</h3><div class="value">₹'+todayTotal.toLocaleString()+'</div></div>';
  html+='<div class="stat-card"><h3>This Month ('+MONTHS[parseInt(thisMonth.split('-')[1])-1]+')</h3><div class="value">₹'+monthTotal.toLocaleString()+'</div></div>';

  // Category bars
  var maxCat=1;
  var catKeys=Object.keys(catTotals);
  for(var i=0;i<catKeys.length;i++){if(catTotals[catKeys[i]]>maxCat)maxCat=catTotals[catKeys[i]]}
  var colors=['#C4553A','#E8734A','#F4A261','#2A9D8F','#264653','#6A4C93','#1982C4','#8AC926','#FF595E'];
  html+='<div class="stat-card"><h3>Category Breakdown</h3>';
  for(var i=0;i<catKeys.length;i++){
    var cat=getCat(catKeys[i]);
    var pct=Math.round((catTotals[catKeys[i]]/maxCat)*100);
    var col=colors[i%colors.length];
    html+='<div class="bar-row"><span class="bar-label">'+cat.emoji+' '+cat.label+'</span><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+col+'"></div></div><span class="bar-amount">₹'+catTotals[catKeys[i]].toLocaleString()+'</span></div>';
  }
  html+='</div>';

  // Today's expenses
  html+='<div class="stat-card"><h3>Today\'s Expenses</h3>';
  if(todayExpenses.length===0){
    html+='<div class="empty-state"><div class="big">📭</div><p>No expenses today</p></div>';
  } else {
    for(var i=0;i<todayExpenses.length;i++){
      var e=todayExpenses[i];
      var cat=getCat(e.category);
      html+='<div class="expense-item"><span class="emoji">'+cat.emoji+'</span><div class="info"><div class="desc">'+(e.description||cat.label)+'</div><div class="meta">'+fmtDate(e.date)+'</div></div><span class="amt">₹'+e.amount.toLocaleString()+'</span></div>';
    }
  }
  html+='</div>';

  document.getElementById('contentArea').innerHTML=html;
}

// Render history
async function renderHistory(filter){
  var expenses=await dbGetAll('expenses');
  expenses.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0)});

  if(filter){
    var f=filter.toLowerCase();
    expenses=expenses.filter(function(e){
      var cat=getCat(e.category);
      return (e.description||'').toLowerCase().includes(f)||cat.label.toLowerCase().includes(f)||(e.amount+'').includes(f);
    });
  }

  var html='<input type="text" class="search-bar" id="searchInput" placeholder="Search expenses..." value="'+(filter||'')+'">';
  if(expenses.length===0){
    html+='<div class="empty-state"><div class="big">📋</div><p>'+(filter?'No matching expenses':'No expenses yet. Tap + to add one.')+'</p></div>';
  } else {
    for(var i=0;i<expenses.length;i++){
      var e=expenses[i];
      var cat=getCat(e.category);
      html+='<div class="expense-item"><span class="emoji">'+cat.emoji+'</span><div class="info"><div class="desc">'+(e.description||cat.label)+'</div><div class="meta">'+fmtDate(e.date)+' · '+cat.label+'</div></div><span class="amt">₹'+e.amount.toLocaleString()+'</span><button class="del" data-id="'+e.id+'">×</button></div>';
    }
  }
  document.getElementById('contentArea').innerHTML=html;

  var si=document.getElementById('searchInput');
  if(si){
    si.oninput=function(){
      renderHistory(this.value);
    };
  }

  var delBtns=document.querySelectorAll('.expense-item .del');
  for(var i=0;i<delBtns.length;i++){
    delBtns[i].onclick=function(){
      var id=this.getAttribute('data-id');
      showConfirm('Delete Expense','Are you sure you want to delete this expense?',function(){
        dbDel(id,'expenses').then(function(){
          toast('Expense deleted');
          renderHistory();
        });
      });
    };
  }
}

// Render settings
async function renderSettings(){
  var profile=await dbGet('profile','app');
  var count=(await dbGetAll('expenses')).length;
  var html='<div class="stat-card"><h3>Profile</h3><div class="settings-row"><span>Name</span><span style="font-weight:600">'+(profile?profile.name:'-')+'</span></div><div class="settings-row"><span>Total Expenses</span><span style="font-weight:600;color:#C4553A">'+count+'</span></div></div>';
  html+='<div class="settings-card"><h3>Data</h3><p>Export your data as a JSON file for backup.</p><button class="btn btn-primary" id="exportBtn" style="max-width:100%">Export JSON</button></div>';
  html+='<div class="settings-card"><h3>Import Data</h3><p>Restore from a previously exported JSON file.</p><input type="file" id="importFile" accept=".json" style="margin-bottom:12px;width:100%"><button class="btn btn-primary" id="importBtn" style="max-width:100%">Import JSON</button></div>';
  html+='<div class="settings-card"><h3>Change Password</h3><div class="form-group"><label>Current Password</label><input type="password" id="curPass"></div><div class="form-group"><label>New Password</label><input type="password" id="newPass"></div><button class="btn btn-primary" id="changePassBtn" style="max-width:100%">Change Password</button></div>';
  html+='<div class="settings-card"><h3>Danger Zone</h3><p>Delete all expenses and reset the app.</p><button class="btn" id="dangerBtn" style="width:100%;background:#C4553A;color:#fff">Delete All Data</button></div>';
  document.getElementById('contentArea').innerHTML=html;

  document.getElementById('exportBtn').onclick=async function(){
    var data=await dbGetAll('expenses');
    var blob=new Blob([JSON.stringify({version:'1.0',exportedAt:new Date().toISOString(),expenses:data},null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='expense_diary_'+todayStr()+'.json';
    a.click();
    toast('Exported successfully');
  };

  document.getElementById('importBtn').onclick=function(){
    var file=document.getElementById('importFile').files[0];
    if(!file){toast('Select a file first');return}
    var reader=new FileReader();
    reader.onload=async function(e){
      try{
        var data=JSON.parse(e.target.result);
        if(!data.expenses){toast('Invalid file format');return}
        for(var i=0;i<data.expenses.length;i++){
          await dbPut(data.expenses[i],'expenses');
        }
        toast('Imported '+data.expenses.length+' expenses');
        renderSettings();
      }catch(err){toast('Failed to parse file');}
    };
    reader.readAsText(file);
  };

  document.getElementById('changePassBtn').onclick=async function(){
    var cur=document.getElementById('curPass').value;
    var nw=document.getElementById('newPass').value;
    if(!cur||!nw){toast('Fill both fields');return}
    if(nw.length<4){toast('New password must be at least 4 characters');return}
    var profile=await dbGet('profile','app');
    var hash=await sha256(cur);
    if(hash!==profile.passwordHash){toast('Current password is wrong');return}
    profile.passwordHash=await sha256(nw);
    await dbPut(profile,'app');
    toast('Password changed');
  };

  document.getElementById('dangerBtn').onclick=function(){
    showConfirm('Delete All Data','This will delete ALL your expenses and reset the app. This cannot be undone.',async function(){
      var expenses=await dbGetAll('expenses');
      for(var i=0;i<expenses.length;i++){await dbDel(expenses[i].id,'expenses')}
      await dbDel('profile','app');
      toast('All data deleted');
      showScreen('setupScreen');
    });
  };
}

// Tab switching
function switchTab(tab){
  currentTab=tab;
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].classList.toggle('active',tabs[i].getAttribute('data-tab')===tab);
  }
  if(tab==='dashboard')renderDashboard();
  else if(tab==='history')renderHistory();
  else if(tab==='settings')renderSettings();
}

// Save expense
async function saveExpense(){
  var amount=parseFloat(document.getElementById('expAmount').value);
  var desc=document.getElementById('expDesc').value.trim();
  var date=document.getElementById('expDate').value;

  if(!amount||amount<=0){toast('Enter a valid amount');return}
  if(!date){toast('Select a date');return}

  var expense={
    id:'exp_'+Date.now()+'_'+Math.random().toString(36).substr(2,6),
    amount:amount,
    category:selectedCat,
    description:desc,
    date:date,
    createdAt:Date.now()
  };

  await dbPut(expense,'expenses');
  document.getElementById('addModal').classList.remove('active');
  document.getElementById('expAmount').value='';
  document.getElementById('expDesc').value='';
  document.getElementById('expDate').value=todayStr();
  selectedCat='food';
  buildCatGrid();
  toast('Expense saved');
  switchTab(currentTab);
}

// INIT
async function init(){
  try{
    var profile=await dbGet('profile','app');
    // Hide splash after 1.5s
    setTimeout(function(){
      if(!profile){
        showScreen('setupScreen');
      } else {
        showScreen('loginScreen');
      }
    },1500);

    // Setup button
    document.getElementById('setupBtn').onclick=async function(){
      var name=document.getElementById('setupName').value.trim();
      var pass=document.getElementById('setupPass').value;
      var pass2=document.getElementById('setupPass2').value;
      document.getElementById('setupErr').style.display='none';
      document.getElementById('setupErr2').style.display='none';

      if(!name){toast('Enter your name');return}
      if(pass.length<4){document.getElementById('setupErr').style.display='block';return}
      if(pass!==pass2){document.getElementById('setupErr2').style.display='block';return}

      var hash=await sha256(pass);
      await dbPut({key:'profile',name:name,passwordHash:hash,createdAt:Date.now()},'app');
      toast('Account created!');
      showScreen('mainScreen');
      switchTab('dashboard');
    };

    // Login button
    document.getElementById('loginBtn').onclick=async function(){
      var pass=document.getElementById('loginPass').value;
      document.getElementById('loginErr').style.display='none';
      if(!pass){toast('Enter password');return}
      var profile=await dbGet('profile','app');
      var hash=await sha256(pass);
      if(hash!==profile.passwordHash){document.getElementById('loginErr').style.display='block';return}
      document.getElementById('loginPass').value='';
      showScreen('mainScreen');
      switchTab('dashboard');
    };

    // Enter key on login
    document.getElementById('loginPass').onkeydown=function(e){
      if(e.key==='Enter')document.getElementById('loginBtn').click();
    };

    // Reset button
    document.getElementById('resetBtn').onclick=function(){
      showConfirm('Reset Everything','Delete all data and start fresh?',async function(){
        var expenses=await dbGetAll('expenses');
        for(var i=0;i<expenses.length;i++){await dbDel(expenses[i].id,'expenses')}
        await dbDel('profile','app');
        toast('Reset complete');
        showScreen('setupScreen');
      });
    };

    // Tabs
    var tabs=document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){
      tabs[i].onclick=function(){switchTab(this.getAttribute('data-tab'))};
    }

    // FAB
    document.getElementById('fabBtn').onclick=function(){
      document.getElementById('expDate').value=todayStr();
      selectedCat='food';
      buildCatGrid();
      document.getElementById('addModal').classList.add('active');
    };

    // Save expense
    document.getElementById('saveExpBtn').onclick=saveExpense;

    // Cancel expense
    document.getElementById('cancelExpBtn').onclick=function(){
      document.getElementById('addModal').classList.remove('active');
    };

    // Confirm modal buttons
    document.getElementById('confirmYes').onclick=function(){
      document.getElementById('confirmModal').classList.remove('active');
      if(confirmCb)confirmCb();
      confirmCb=null;
    };
    document.getElementById('confirmNo').onclick=function(){
      document.getElementById('confirmModal').classList.remove('active');
      confirmCb=null;
    };

    // Register service worker
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js').catch(function(err){
        console.log('SW registration failed:',err);
      });
    }

  }catch(err){
    debug('Init error: '+err.message);
  }
}

init();
</script>
</body>
</html>
