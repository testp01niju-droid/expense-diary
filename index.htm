<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Expense Diary</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C4553A">
<style>
:root{--bg:#FAF6F1;--bg2:#F4EFE8;--b:#2D2A26;--m:#6B6560;--p:#C4553A;--ok:#2E7D32;--er:#C62828;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--b);min-height:100vh;display:flex;flex-direction:column}
.hdr{padding:16px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.hdr h1{margin:0;font-size:18px;font-weight:700}
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #e0dcd7;z-index:10}
.tab-bar button{background:none;border:none;font-size:11px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.tab-bar button.act{color:var(--p);font-weight:600}
.tab-bar span{font-size:20px}
main{flex:1;padding:16px 16px 80px;overflow-y:auto}
.cd{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.cd h3{margin:0 0 8px;font-size:15px;font-weight:700}
.fg{margin-bottom:12px}
.fl{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--m)}
.fi,.fs,.ft{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
.ft{resize:vertical;min-height:80px}
.bp,.bs{width:100%;padding:14px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.bp{background:var(--p);color:#fff}
.bs{background:var(--bg2);color:var(--b)}
.oc{border:1px dashed var(--p);background:rgba(196,85,58,.05)}
.mb{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.mb.sh{display:flex}
.mx{background:#fff;border-radius:var(--r);padding:16px;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;position:relative}
.mh{height:4px;width:40px;background:#ddd;border-radius:2px;margin:0 auto 12px}
.pb{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:8px 0}
.bf{height:100%;background:var(--p);width:0%;transition:width .2s}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;text-align:left;border-bottom:1px solid #eee}
th{color:var(--m);font-weight:600}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.sh{opacity:1}
.toast.ok{background:var(--ok)}
.toast.er{background:var(--er)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="auth" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:30">
  <div class="cd" style="width:90%;max-width:320px;text-align:center">
    <h2 id="authTitle">🔓 Expense Diary</h2>
    <input type="password" id="pin" class="fi" placeholder="Enter PIN" inputmode="numeric">
    <button class="bp" id="loginBtn" style="margin-top:12px">Unlock</button>
    <p id="authErr" style="color:var(--er);font-size:12px;margin-top:8px;display:none"></p>
  </div>
</div>

<div id="app" style="display:none">
  <header class="hdr">
    <h1 id="appTitle">Expense Diary</h1>
    <button id="langBtn" style="background:none;border:1px solid var(--m);padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer">EN/தமிழ்</button>
  </header>
  <main>
    <div id="tabDash" class="tab">
      <div class="cd"><h3 id="dTotal">Total: ₹0</h3></div>
      <div class="cd"><h3 id="dMonth">This Month: ₹0</h3></div>
      <div class="cd" id="dCats"></div>
    </div>
    <div id="tabAdd" class="tab" style="display:none">
      <div class="cd oc" id="ocrCard">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:44px;height:44px;border-radius:10px;background:rgba(212,168,67,.15);display:flex;align-items:center;justify-content:center"><span style="font-size:22px">📷</span></div>
          <div style="flex:1"><p style="font-weight:600;font-size:13px" id="ocrTitle">Scan Receipt / Diary</p><p style="font-size:11px;color:var(--m)" id="ocrSub">Camera or upload image</p></div>
          <span style="color:var(--m)">▶</span>
        </div>
      </div>
      <div class="cd oc" id="bulkCard">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:44px;height:44px;border-radius:10px;background:rgba(46,125,50,.15);display:flex;align-items:center;justify-content:center"><span style="font-size:22px">📝</span></div>
          <div style="flex:1"><p style="font-weight:600;font-size:13px" id="bulkTitle">Bulk Entry</p><p style="font-size:11px;color:var(--m)" id="bulkSub">Paste text → auto-categorize</p></div>
          <span style="color:var(--m)">▶</span>
        </div>
      </div>
      <div class="cd">
        <div class="fg"><label class="fl" id="lAmt">Amount (₹)</label><input type="number" id="fAmt" class="fi" inputmode="decimal"></div>
        <div class="fg"><label class="fl" id="lDate">Date</label><input type="date" id="fDate" class="fi"></div>
        <div class="fg"><label class="fl" id="lCat">Category</label>
          <select id="fCat" class="fs">
            <option value="food">🍛 Food</option><option value="transport">🚌 Transport</option><option value="shopping">🛍️ Shopping</option>
            <option value="bills">💡 Bills</option><option value="health">🏥 Health</option><option value="education">📚 Education</option>
            <option value="entertainment">🎬 Entertainment</option><option value="rent">🏠 Rent</option><option value="others">📦 Others</option>
          </select>
        </div>
        <div class="fg"><label class="fl" id="lDesc">Description</label><input type="text" id="fDesc" class="fi"></div>
        <button class="bp" id="saveBtn">Save Expense</button>
      </div>
    </div>
    <div id="tabHist" class="tab" style="display:none">
      <div class="fg"><input type="text" id="search" class="fi" placeholder="Search..."></div>
      <div id="histList"></div>
    </div>
    <div id="tabSet" class="tab" style="display:none">
      <div class="cd"><button class="bp" id="expBtn">📤 Export JSON</button></div>
      <div class="cd"><input type="file" id="impFile" accept=".json" style="display:none"><button class="bs" id="impBtn">📥 Import JSON</button></div>
      <div class="cd"><button class="bs" id="clrBtn" style="color:var(--er);border:1px solid var(--er)">🗑️ Clear All Data</button></div>
      <p style="text-align:center;font-size:11px;color:var(--m);margin-top:20px">v1.3 Smart PWA • Offline First</p>
    </div>
  </main>
  <nav class="tab-bar">
    <button data-t="Dash" class="act"><span>📊</span><b id="tDash">Dash</b></button>
    <button data-t="Add"><span>➕</span><b id="tAdd">Add</b></button>
    <button data-t="Hist"><span>📋</span><b id="tHist">History</b></button>
    <button data-t="Set"><span>⚙️</span><b id="tSet">Settings</b></button>
  </nav>
</div>

<!-- OCR Modal -->
<div id="ocrModal" class="mb">
  <div class="mx">
    <div style="position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer" id="ocrClose">✕</div>
    <div class="mh"></div>
    <h3 style="margin-bottom:12px" id="ocrMTitle">Scan Receipt</h3>
    <div id="ocrStep1">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button class="cd oc" id="ocrCam" style="text-align:center;padding:16px 0"><span style="font-size:26px;display:block;margin-bottom:4px">📷</span><span id="ocrCamTxt">Camera</span></button>
        <button class="cd oc" id="ocrUp" style="text-align:center;padding:16px 0"><span style="font-size:26px;display:block;margin-bottom:4px">📎</span><span id="ocrUpTxt">Upload</span></button>
      </div>
      <input type="file" id="ocrFile" accept="image/*" capture="environment" style="display:none">
    </div>
    <div id="ocrStep2" style="display:none">
      <div style="border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--bg2);display:flex;align-items:center;justify-content:center;max-height:220px"><img id="ocrPrev" style="max-width:100%;max-height:220px;object-fit:contain"></div>
      <div style="display:flex;gap:10px"><button class="bs" style="flex:1" id="ocrRetake">Retake</button><button class="bp" style="flex:1" id="ocrProc">Process</button></div>
    </div>
    <div id="ocrStep3" style="display:none;text-align:center;padding:20px 0">
      <div style="width:40px;height:40px;border-radius:50%;border:4px solid var(--b);border-top-color:var(--p);margin:0 auto 10px;animation:spin 1s linear infinite"></div>
      <p style="font-weight:600;margin-bottom:6px" id="ocrProcTxt">Recognizing...</p>
      <div class="pb"><div class="bf" id="ocrBar" style="width:0%"></div></div>
      <p style="font-size:12px;color:var(--m);margin-top:8px" id="ocrPct">0%</p>
    </div>
  </div>
</div>

<!-- Bulk Preview Modal -->
<div id="bulkModal" class="mb">
  <div class="mx">
    <div style="position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer" id="bulkClose">✕</div>
    <div class="mh"></div>
    <h3 style="margin-bottom:10px" id="bulkMTitle">Review Entries</h3>
    <textarea id="bulkInput" class="ft" placeholder="Paste expenses here..."></textarea>
    <button class="bp" id="bulkParse" style="margin:10px 0">Parse / பகுப்பாய்வு</button>
    <div id="bulkPreview" style="display:none">
      <table id="bulkTable"><thead><tr><th>Date</th><th>Category</th><th>₹</th><th>Desc</th><th></th></tr></thead><tbody id="bulkBody"></tbody></table>
      <p style="text-align:right;font-weight:700;margin:10px 0" id="bulkTotal">Total: ₹0</p>
      <div style="display:flex;gap:10px"><button class="bs" style="flex:1" id="bulkCancel">Cancel</button><button class="bp" style="flex:1" id="bulkSubmit">Submit All</button></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  // === CONFIG ===
  const OCR_API_KEY = 'K85538498888957'; // ← Replace with OCR.Space free key
  const PIN_HASH = '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92'; // Default: 123456
  let lang = localStorage.getItem('lang') || 'en';
  let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
  let queue = JSON.parse(localStorage.getItem('queue') || '[]');
  let bulkData = [];

  // === I18N ===
  const i18n = {
    en: {app:'Expense Diary',auth:'🔓 Expense Diary',pin:'Enter PIN',unlock:'Unlock',dash:'Dash',add:'Add',hist:'History',set:'Settings',
         total:'Total: ₹',month:'This Month: ₹',amt:'Amount (₹)',date:'Date',cat:'Category',desc:'Description',save:'Save Expense',
         search:'Search...',export:'📤 Export JSON',import:'📥 Import JSON',clear:'🗑️ Clear All Data',ocrT:'Scan Receipt / Diary',ocrS:'Camera or upload image',
         bulkT:'Bulk Entry',bulkS:'Paste text → auto-categorize',cam:'Camera',up:'Upload',retake:'Retake',proc:'Process',recog:'Recognizing...',
         review:'Review Entries',parse:'Parse / பகுப்பாய்வு',cancel:'Cancel',submit:'Submit All',parsed:'Parsed',noValid:'No valid expenses found.',
         saved:'Saved successfully',err:'Error',offline:'Offline. Queued for sync.',cleared:'All data cleared',imported:'Imported successfully'},
    ta: {app:'செலவு பதிவேடு',auth:'🔓 செலவு பதிவேடு',pin:'PIN உள்ளிடவும்',unlock:'திற',dash:'டாஷ்',add:'சேர்',hist:'வரலாறு',set:'அமைப்புகள்',
         total:'மொத்தம்: ₹',month:'இந்த மாதம்: ₹',amt:'தொகை (₹)',date:'தேதி',cat:'வகை',desc:'விளக்கம்',save:'சேமி',
         search:'தேடு...',export:'📤 ஏற்றுமதி',import:'📥 இறக்குமதி',clear:'🗑️ அனைத்தையும் அழி',ocrT:'ரசீது ஸ்கேன்',ocrS:'கேமரா அல்லது பதிவேற்றம்',
         bulkT:'மொத்த உள்ளீடு',bulkS:'உரையை ஒட்டி → தானாக வகைப்படுத்தவும்',cam:'கேமரா',up:'பதிவேற்றம்',retake:'மீண்டும் எடு',proc:'செயலாக்கு',recog:'அங்கீகரிக்கிறது...',
         review:'உள்ளீடுகளை மதிப்பாய்வு செய்',parse:'பகுப்பாய்வு',cancel:'ரத்து',submit:'அனைத்தையும் சேமி',parsed:'பகுப்பாய்வு',noValid:'செலவுகள் கிடைக்கவில்லை.',
         saved:'வெற்றிகரமாக சேமிக்கப்பட்டது',err:'பிழை',offline:'இணையம் இல்லை. வரிசையில் சேர்க்கப்பட்டது.',cleared:'அனைத்தும் அழிக்கப்பட்டது',imported:'இறக்குமதி வெற்றி'}
  };
  const t = k => i18n[lang][k] || k;
  const isTa = () => lang === 'ta';

  // === DOM ===
  const $ = id => document.getElementById(id);
  const toast = (msg, type='ok') => {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast sh ' + type;
    setTimeout(()=> el.classList.remove('sh'), 2500);
  };

  // === AUTH ===
  async function hashPin(pin){
    const buf = new TextEncoder().encode(pin);
    const h = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  $('loginBtn').onclick = async ()=>{
    const pin = $('pin').value;
    if(await hashPin(pin) === PIN_HASH){
      $('auth').style.display='none';
      $('app').style.display='block';
      initApp();
    } else {
      $('authErr').textContent = isTa()?'தவறான PIN':'Wrong PIN';
      $('authErr').style.display='block';
    }
  };

  // === STORAGE & SYNC ===
  function saveData(){
    localStorage.setItem('expenses', JSON.stringify(expenses));
    renderDash();
    renderHist();
  }
  function pushQueue(item){
    queue.push(item);
    localStorage.setItem('queue', JSON.stringify(queue));
    if(navigator.onLine) flushQueue();
  }
  function flushQueue(){
    if(!navigator.onLine || queue.length===0) return;
    expenses.push(...queue);
    queue = [];
    localStorage.setItem('queue', '[]');
    saveData();
    toast(isTa()?'Synced':'Synced');
  }
  window.addEventListener('online', flushQueue);

  // === PARSER ===
  function parseText(text){
    const lines = text.split(/[,|\n|and]+/).map(l=>l.trim()).filter(l=>l.length>2);
    const today = new Date().toISOString().split('T')[0];
    const yesterday = new Date(Date.now()-86400000).toISOString().split('T')[0];
    const catMap = {
      food:/food|lunch|dinner|breakfast|tea|coffee|சாப்பாடு|உணவு|பிரியாணி|டீ|காபி|rice|dosa|meal/i,
      transport:/transport|bus|train|auto|uber|ola|பேருந்து|ரயில்|ஆட்டோ|பயணம்|fare|ticket/i,
      shopping:/shop|purchase|buy|grocery|supermarket|கடை|மளிகை|வாங்கு|mart|store/i,
      bills:/bill|electricity|water|mobile|recharge|மின்சாரம்|தண்ணீர்|பில்|eb|current/i,
      health:/health|medicine|doctor|hospital|மருந்து|மருத்துவம்|ஆஸ்பத்திரி|pharmacy|clinic/i,
      education:/education|school|college|fee|tuition|பள்ளி|கல்லூரி|கட்டணம்|book|exam/i,
      entertainment:/entertainment|movie|cinema|game|படம்|சினிமா|விளையாட்டு|recharge|ott/i,
      rent:/rent|house|lease|வாடகை|வீடு|owner|pg|hostel/i
    };
    return lines.map(line=>{
      let dt = today;
      if(/yesterday|நேற்று/i.test(line)) dt = yesterday;
      const dm = line.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
      if(dm){ let y=dm[3].length===2?'20'+dm[3]:dm[3]; dt=`${y}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}`; }
      const am = line.match(/₹\s*([\d,]+\.?\d*)/i) || line.match(/rs\.?\s*([\d,]+\.?\d*)/i) || line.match(/(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?)/);
      const amt = am ? parseFloat(am[1].replace(/,/g,'')) : 0;
      let cat = 'others';
      for(const [c,r] of Object.entries(catMap)) if(r.test(line)){ cat=c; break; }
      const desc = line.replace(/₹|rs\.?|\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|[\/\-\.]\d{1,4}|yesterday|today|நேற்று|இன்று/gi,'').trim().substring(0,60) || cat;
      return {date:dt, category:cat, amount:amt, description:desc};
    }).filter(e=>e.amount>0);
  }

  // === OCR ===
  let ocrImg = null;
  function preprocessImage(dataUrl){
    return new Promise(res=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas'), ctx=c.getContext('2d');
        const sc=Math.max(1, 1800/img.width);
        c.width=img.width*sc; c.height=img.height*sc;
        ctx.drawImage(img,0,0,c.width,c.height);
        const d=ctx.getImageData(0,0,c.width,c.height).data;
        for(let i=0;i<d.length;i+=4){ let g=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114; g=g>140?255:0; d[i]=d[i+1]=d[i+2]=g; }
        ctx.putImageData(new ImageData(d,c.width,c.height),0,0);
        res(c.toDataURL('image/png'));
      };
      img.src=dataUrl;
    });
  }
  async function runOCR(){
    if(!ocrImg) return;
    $('ocrStep2').style.display='none'; $('ocrStep3').style.display='block';
    try{
      const proc = await preprocessImage(ocrImg);
      const fd=new FormData();
      fd.append('base64Image', proc);
      fd.append('language','eng+tam');
      fd.append('isOverlayRequired','false');
      fd.append('scale','true');
      fd.append('isTable','true');
      fd.append('detectOrientation','true');
      const res=await fetch('https://api.ocr.space/parse/image',{method:'POST',headers:{'apikey':OCR_API_KEY},body:fd});
      const json=await res.json();
      if(json.OCRExitCode!==1) throw new Error(json.ErrorMessage?.join(', ')||'API failed');
      const text=json.ParsedResults[0].ParsedText;
      const parsed=parseText(text);
      if(parsed.length===0){ toast(t('noValid'),'er'); resetOCR(); return; }
      bulkData=parsed;
      renderBulkTable();
      $('ocrModal').classList.remove('sh');
      $('bulkModal').classList.add('sh');
    }catch(e){
      console.error(e);
      toast(t('err')+': '+e.message,'er');
      resetOCR();
    }
  }
  function resetOCR(){
    ocrImg=null;
    $('ocrStep1').style.display='block'; $('ocrStep2').style.display='none'; $('ocrStep3').style.display='none';
    $('ocrBar').style.width='0%'; $('ocrPct').textContent='0%';
  }

  // === BULK UI ===
  function renderBulkTable(){
    const tb=$('bulkBody'); tb.innerHTML='';
    let total=0;
    bulkData.forEach((e,i)=>{
      total+=e.amount;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><input type="date" class="fi" value="${e.date}" onchange="bulkData[${i}].date=this.value" style="padding:4px;font-size:12px"></td>
        <td><select class="fs" onchange="bulkData[${i}].category=this.value" style="padding:4px;font-size:12px">
          ${['food','transport','shopping','bills','health','education','entertainment','rent','others'].map(c=>`<option value="${c}" ${c===e.category?'selected':''}>${c}</option>`).join('')}
        </select></td>
        <td><input type="number" class="fi" value="${e.amount}" onchange="bulkData[${i}].amount=parseFloat(this.value)||0" style="padding:4px;font-size:12px;width:70px"></td>
        <td><input type="text" class="fi" value="${e.description}" onchange="bulkData[${i}].description=this.value" style="padding:4px;font-size:12px"></td>
        <td><button style="background:none;border:none;color:var(--er);cursor:pointer" onclick="bulkData.splice(${i},1);renderBulkTable()">✕</button></td>`;
      tb.appendChild(tr);
    });
    $('bulkTotal').textContent = `${t('total')}${total.toFixed(2)}`;
    $('bulkPreview').style.display='block';
  }

  // === RENDER ===
  function renderDash(){
    const tot=expenses.reduce((s,e)=>s+e.amount,0);
    const now=new Date(), mExp=expenses.filter(e=>{const d=new Date(e.date); return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
    const mTot=mExp.reduce((s,e)=>s+e.amount,0);
    $('dTotal').textContent=`${t('total')}${tot.toFixed(2)}`;
    $('dMonth').textContent=`${t('month')}${mTot.toFixed(2)}`;
    const cats={};
    expenses.forEach(e=>{ cats[e.category]=(cats[e.category]||0)+e.amount; });
    let html='';
    for(const [c,a] of Object.entries(cats).sort((x,y)=>y[1]-x[1])){
      const pct=Math.round((a/tot)*100)||0;
      html+=`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>${c}</span><span>₹${a.toFixed(0)}</span></div><div class="pb"><div class="bf" style="width:${pct}%"></div></div></div>`;
    }
    $('dCats').innerHTML=html||'<p style="color:var(--m);font-size:12px">No data yet</p>';
  }
  function renderHist(){
    const q=$('search').value.toLowerCase();
    const list=expenses.filter(e=>!q||e.description.toLowerCase().includes(q)||e.category.includes(q)).sort((a,b)=>new Date(b.date)-new Date(a.date));
    let html='';
    list.forEach((e,i)=>{
      html+=`<div class="cd" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px">
        <div><p style="font-weight:600;font-size:13px">${e.description}</p><p style="font-size:11px;color:var(--m)">${e.date} • ${e.category}</p></div>
        <div style="text-align:right"><p style="font-weight:700">₹${e.amount.toFixed(2)}</p><button style="background:none;border:none;color:var(--er);font-size:12px;cursor:pointer" onclick="delExp(${expenses.indexOf(e)})">Delete</button></div>
      </div>`;
    });
    $('histList').innerHTML=html||'<p style="text-align:center;color:var(--m);margin-top:20px">No expenses</p>';
  }
  window.delExp = i => { if(confirm(isTa()?'நீக்கவா?':'Delete?')){ expenses.splice(i,1); saveData(); } };

  // === EVENTS ===
  function initApp(){
    // Lang
    $('langBtn').onclick = ()=>{ lang = isTa()?'en':'ta'; localStorage.setItem('lang',lang); applyLang(); };
    function applyLang(){
      $('appTitle').textContent=t('app'); $('authTitle').textContent=t('auth'); $('pin').placeholder=t('pin'); $('loginBtn').textContent=t('unlock');
      $('tDash').textContent=t('dash'); $('tAdd').textContent=t('add'); $('tHist').textContent=t('hist'); $('tSet').textContent=t('set');
      $('lAmt').textContent=t('amt'); $('lDate').textContent=t('date'); $('lCat').textContent=t('cat'); $('lDesc').textContent=t('desc'); $('saveBtn').textContent=t('save');
      $('search').placeholder=t('search'); $('expBtn').textContent=t('export'); $('impBtn').textContent=t('import'); $('clrBtn').textContent=t('clear');
      $('ocrTitle').textContent=t('ocrT'); $('ocrSub').textContent=t('ocrS'); $('bulkTitle').textContent=t('bulkT'); $('bulkSub').textContent=t('bulkS');
      $('ocrMTitle').textContent=t('ocrT'); $('ocrCamTxt').textContent=t('cam'); $('ocrUpTxt').textContent=t('up'); $('ocrRetake').textContent=t('retake');
      $('ocrProc').textContent=t('proc'); $('ocrProcTxt').textContent=t('recog'); $('bulkMTitle').textContent=t('review'); $('bulkParse').textContent=t('parse');
      $('bulkCancel').textContent=t('cancel'); $('bulkSubmit').textContent=t('submit');
      renderDash(); renderHist();
    }
    applyLang();

    // Tabs
    document.querySelectorAll('.tab-bar button').forEach(b=>{
      b.onclick=()=>{
        document.querySelectorAll('.tab-bar button').forEach(x=>x.classList.remove('act'));
        b.classList.add('act');
        document.querySelectorAll('.tab').forEach(t=>t.style.display='none');
        $('tab'+b.dataset.t).style.display='block';
      };
    });

    // Save
    $('saveBtn').onclick=()=>{
      const amt=parseFloat($('fAmt').value)||0, dt=$('fDate').value, cat=$('fCat').value, desc=$('fDesc').value.trim();
      if(!amt||!dt){ toast(t('err'),'er'); return; }
      const entry={date:dt,category:cat,amount:amt,description:desc||cat};
      if(navigator.onLine){ expenses.push(entry); saveData(); toast(t('saved')); }
      else { pushQueue(entry); toast(t('offline')); }
      $('fAmt').value=''; $('fDesc').value='';
    };

    // OCR Triggers
    $('ocrCard').onclick=()=>{ if(!navigator.onLine){ toast(t('offline'),'er'); return; } resetOCR(); $('ocrModal').classList.add('sh'); };
    $('ocrClose').onclick=()=> $('ocrModal').classList.remove('sh');
    $('ocrCam').onclick=()=>{ const f=$('ocrFile'); f.setAttribute('capture','environment'); f.click(); };
    $('ocrUp').onclick=()=>{ const f=$('ocrFile'); f.removeAttribute('capture'); f.click(); };
    $('ocrFile').onchange=e=>{ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>{ ocrImg=ev.target.result; $('ocrPrev').src=ocrImg; $('ocrStep1').style.display='none'; $('ocrStep2').style.display='block'; }; r.readAsDataURL(file); e.target.value=''; };
    $('ocrRetake').onclick=resetOCR;
    $('ocrProc').onclick=runOCR;

    // Bulk Triggers
    $('bulkCard').onclick=()=>{ bulkData=[]; $('bulkInput').value=''; $('bulkPreview').style.display='none'; $('bulkModal').classList.add('sh'); };
    $('bulkClose').onclick=()=> $('bulkModal').classList.remove('sh');
    $('bulkParse').onclick=()=>{ const txt=$('bulkInput').value; if(!txt.trim()) return; bulkData=parseText(txt); if(bulkData.length===0){ toast(t('noValid'),'er'); return; } renderBulkTable(); };
    $('bulkCancel').onclick=()=> $('bulkModal').classList.remove('sh');
    $('bulkSubmit').onclick=()=>{
      if(bulkData.length===0) return;
      if(navigator.onLine){ expenses.push(...bulkData); saveData(); toast(`${bulkData.length} ${t('saved')}`); }
      else { pushQueue(...bulkData); toast(t('offline')); }
      $('bulkModal').classList.remove('sh');
    };

    // Settings
    $('expBtn').onclick=()=>{ const b=new Blob([JSON.stringify(expenses)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='expenses.json'; a.click(); };
    $('impBtn').onclick=()=> $('impFile').click();
    $('impFile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ try{ expenses=JSON.parse(ev.target.result); saveData(); toast(t('imported')); }catch(err){ toast(t('err'),'er'); } }; r.readAsText(f); };
    $('clrBtn').onclick=()=>{ if(confirm(isTa()?'அனைத்தையும் அழிக்கவா?':'Clear all?')){ expenses=[]; queue=[]; localStorage.clear(); saveData(); toast(t('cleared')); } };

    // Search
    $('search').oninput=renderHist;

    // Init date
    $('fDate').value = new Date().toISOString().split('T')[0];
    renderDash(); renderHist();
  }

  // SW Register
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').then(()=>console.log('SW OK')).catch(e=>console.log('SW Fail',e));
  }
})();
</script>
</body>
</html>
