/* ===== BULK PARSER ===== */
function parseBulk(text){
var entries=[],date=td(),lo=text.toLowerCase(),lines=text.split(/[,;\n]+|\band\b/i);
for(var i=0;i<lines.length;i++){
var p=lines[i].trim();if(!p||p.length<2)continue;
var amt=0,cat='others',ds=p;
var am=p.match(/[\u20b9rs]\.?\s*([\d,]+\.?\d*)/i);
if(am){amt=parseFloat(am[1].replace(/,/g,''));ds=p.replace(am[0],'').replace(/^[\s,]+|[\s,]+$/g,'').trim()}
for(var c=0;c<C.length;c++){if(new RegExp(C[c].kw,'i').test(p)){cat=C[c].id;break}}
ds=ds.replace(new RegExp(C.map(function(c){return c.kw}).join('|'),'i'),'\u0b87\u0b9f\u0ba9\u0bc1').replace(/^[\s\-\:]+|[\s\-\:]+$/g,'').trim();
if(amt>0)entries.push({amount:amt,category:cat,desc:ds,date:date,descTa:''});
}return entries}
}
